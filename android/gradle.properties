# org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter template defaults: AGP 9 new-DSL + built-in Kotlin break
# Flutter's Gradle plugin, Flavorizr and several plugins. Keep opted out.
android.newDsl=false
android.builtInKotlin=false
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8