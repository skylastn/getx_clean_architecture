name: sample_app
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  # State Management
  get: ^4.7.3

  #Widget
  carousel_slider_x: ^7.0.1
  flutter_svg: ^2.3.0
  # universal_html: 2.2.4
  cupertino_icons: ^2.0.0

  #Utility
  dartz: 0.10.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  logging: ^1.3.0
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.1
  # path_provider: ^2.1.3

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.6.0
  change_app_package_name: ^1.5.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/icons/
    - assets/images/
  uses-material-design: true

flavorizr:
  app:
    android:
      flavorDimensions: flavor-type
  flavors:
    development:
      app:
        name: SkyKomik Dev
      android:
        applicationId: id.my.skydemo.komik.dev
        variables:
          FLUTTER_TARGET:
            value: lib/main.dart
      linux:
        bundleId: id.my.skydemo.komik.dev
        variables:
          FLUTTER_TARGET:
            value: lib/main.dart
      windows:
        bundleId: id.my.skydemo.komik.dev
        variables:
          FLUTTER_TARGET:
            value: lib/main.dart
    production:
      app:
        name: SkyKomik
      android:
        applicationId: id.my.skydemo.komik
        variables:
          FLUTTER_TARGET:
            value: lib/main.dart
      linux:
        bundleId: id.my.skydemo.komik
        variables:
          FLUTTER_TARGET:
            value: lib/main.dart
      windows:
        bundleId: id.my.skydemo.komik
        variables:
          FLUTTER_TARGET:
            value: lib/main.dart
