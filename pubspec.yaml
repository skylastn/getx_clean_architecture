name: sample_app
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment:
  sdk: ">=3.3.3 <4.0.0"

dependencies:
  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_crashlytics: ^4.3.5

  # State Management
  get: ^4.7.2

  #Widget
  carousel_slider_x: ^6.0.7
  flutter_svg: ^2.1.0
  universal_html: 2.2.4
  cupertino_icons: ^1.0.6

  #Utility
  dartz: 0.10.1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  logging: ^1.3.0
  intl: ^0.20.2
  flutter_local_notifications: ^19.1.0

  flutter:
    sdk: flutter
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_flavorizr: ^2.4.0
  change_app_package_name: ^1.2.0
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11

flutter:
  assets:
    - assets/icons/
    - assets/images/
  uses-material-design: true

flavorizr:
  app:
    android:
      flavorDimensions: flavor-type
  flavors:
    development:
      app:
        name: SkyKomik Dev
      android:
        applicationId: id.my.skydemo.komik.dev
        variables:
          FLUTTER_TARGET:
            value: lib/main_dev.dart
      linux:
        bundleId: id.my.skydemo.komik.dev
        variables:
          FLUTTER_TARGET:
            value: lib/main_dev.dart
      windows:
        bundleId: id.my.skydemo.komik.dev
        variables:
          FLUTTER_TARGET:
            value: lib/main_dev.dart
    production:
      app:
        name: SkyKomik
      android:
        applicationId: id.my.skydemo.komik
        variables:
          FLUTTER_TARGET:
            value: lib/main_prod.dart
      linux:
        bundleId: id.my.skydemo.komik
        variables:
          FLUTTER_TARGET:
            value: lib/main_prod.dart
      windows:
        bundleId: id.my.skydemo.komik
        variables:
          FLUTTER_TARGET:
            value: lib/main_prod.dart
